[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-separation"
version = "0.1.0"
description = "team-r"
readme = "README.md"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "torch",
    "pandas",
    "librosa",
    "tqdm",
    "soundfile",
    "ffmpeg",
    "sageattention",
    "matplotlib",
    "ml_collections",
    "beartype",
    "rotary_embedding_torch",
    "confluent-kafka",
    "omegaconf",
    "openunmix",
    "einops",
    "accelerate",
]

[tool.setuptools.packages.find]
where = ["vocal_separation"]