services:
  vocal-separation:
    build:
      context: .
      dockerfile: services/vocal-separation/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: vocal-separation-service
    runtime: nvidia

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CHECKPOINT_DIR: /app/checkpoints
      INPUT_DIR: /app/input
      OUTPUT_DIR: /app/output
      CONFIG_DIR: /app/configs
      LOG_DIR: /app/logs
      USE_TMP_WORKFLOW: "1"
      BACKEND_URL: http://backend:8000
    volumes:
      - ${DATA_DIR:-./datasets}/input:/app/input
      - ${DATA_DIR:-./datasets}/separated:/app/output
      - ./services/vocal-separation/checkpoints:/app/checkpoints
    restart: always
    networks:
      - app-net
    depends_on:
      - kafka

  voice-embedding:
    build:
      context: .
      dockerfile: services/voice-embedding/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: voice-embedding-service

    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATA_DIR: /app/datasets
      INPUT_DIR: /app/input
      DB_DIR: /app/db
      LOG_DIR: /app/logs
      BACKEND_URL: http://backend:8000
    volumes:
      - ${DATA_DIR:-./datasets}:/app/datasets
      - ${DATA_DIR:-./datasets}/input:/app/input
      - ${DATA_DIR:-./datasets}/db:/app/db
    restart: always
    networks:
      - app-net
    depends_on:
      - kafka

  voice-conversion:
    build:
      context: .
      dockerfile: services/voice-converter/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: voice-conversion-service

    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      INPUT_DIR: /app/input
      OUTPUT_DIR: /app/output
      LOGDIR: /app/logs
      BACKEND_URL: http://backend:8000
      CHECKPOINT_DIR: /app/checkpoints
    volumes:
      - ${DATA_DIR:-./datasets}:/app/input
      - ${DATA_DIR:-./datasets}/converted:/app/output
      - ./services/voice-converter/checkpoints:/app/checkpoints

    restart: always
    networks:
      - app-net
    depends_on:
      - kafka

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/0.0.0.0/29092"]
      interval: 30s
      retries: 5
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9093:9093"
    networks:
      - app-net
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "jUlz2drYTcK6nrQzmQnRYg"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    command: ["/etc/confluent/docker/run"]

    volumes:
      - kafka_data:/var/lib/kafka/data

  db:
    image: postgres:latest
    container_name: postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=yourdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/backend/db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: always
    networks:
      - app-net

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: backend-service
    depends_on:
      - db
      - kafka
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=yourdb
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_VOCAL_SEPARATION_TOPIC=vocal-separation
      - KAFKA_VOICE_EMBEDDING_TOPIC=voice-embedding
      - KAFKA_VOICE_CONVERSION_TOPIC=voice-conversion
      - PORT=8000
      - BACKEND_URL=http://nginx
      - DATA_DIR=/app/datasets
    ports:
      - "8000:8000"
    volumes:
      - ./scripts/wait-for-it.sh:/wait-for-it.sh
      - static_uploads:/usr/share/nginx/html/uploads
      - static_converted:/usr/share/nginx/html/converted
      - ${DATA_DIR:-./datasets}:/app/datasets
    networks:
      - app-net
    restart: always
    command: >
      sh -c "
        mkdir -p /usr/share/nginx/html/uploads /usr/share/nginx/html/converted &&
        python init_schema.py &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --limit-max-requests 104857600
      "

  nginx:
    build:
      context: .
      dockerfile: services/nginx/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: nginx-service
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - static_uploads:/usr/share/nginx/html/uploads
      - static_converted:/usr/share/nginx/html/converted
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf
    restart: always
    networks:
      - app-net

volumes:
  pgdata:
  kafka_data:
  static_uploads:
  static_converted:

networks:
  app-net:
    driver: bridge
