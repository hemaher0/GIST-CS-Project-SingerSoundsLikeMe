services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - app-net
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "jUlz2drYTcK6nrQzmQnRYg"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://${EXTERNAL_IP:-kafka:9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    command: ["/etc/confluent/docker/run"]

    volumes:
      - kafka_data:/var/lib/kafka/data

  db:
    image: postgres:latest
    container_name: postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=yourdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/backend/db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: always
    networks:
      - app-net

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: backend-service
    depends_on:
      - db
      - kafka
    command: >
      sh -c "chmod +x /wait-for-it.sh &&
             /wait-for-it.sh kafka:29092 --
             /wait-for-it.sh nginx:80 --
             uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=yourdb
      - KAFKA_BOOTSTRAP_SERVERS=${EXTERNAL_IP:-kafka:9092}
      - KAFKA_VOCAL_SEPARATION_TOPIC=vocal-separation
      - KAFKA_VOICE_EMBEDDING_TOPIC=voice-embedding
      - KAFKA_VOICE_CONVERSION_TOPIC=voice-conversion
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./scripts/wait-for-it.sh:/wait-for-it.sh
      - static_uploads:/usr/share/nginx/html/uploads
      - static_converted:/usr/share/nginx/html/converted
    networks:
      - app-net
    restart: always

  nginx:
    build:
      context: .
      dockerfile: services/nginx/Dockerfile
    container_name: nginx-service
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - static_uploads:/usr/share/nginx/html/uploads
      - static_converted:/usr/share/nginx/html/converted
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf
    restart: always
    networks:
      - app-net

volumes:
  pgdata:
  kafka_data:
  static_uploads:
  static_converted:

networks:
  app-net:
    driver: bridge
